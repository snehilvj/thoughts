<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#161616"/>
  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.8" fill="rgba(255,255,255,0.06)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Title -->
  <text x="100" y="280" font-family="monospace" font-size="72" fill="#e0ddd5" font-weight="400">thoughts</text>
  <!-- Cursor -->
  <text x="540" y="280" font-family="monospace" font-size="72" fill="#e2a052">_</text>
  <!-- Tagline -->
  <text x="100" y="340" font-family="monospace" font-size="22" fill="#9a9790">Software, startups, and everything in between.</text>
  <!-- Author -->
  <text x="100" y="400" font-family="monospace" font-size="18" fill="#5c5a56">by Snehil Vijay</text>
  <!-- Accent line -->
  <rect x="100" y="430" width="120" height="2" fill="#e2a052" rx="1"/>
</svg>
